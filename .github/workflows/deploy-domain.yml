name: Deploy to bogdanovyan.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build for root domain
        run: npx vite build --base=/ --outDir dist-domain

      - name: Add SPA fallback pages
        run: |
          cp dist-domain/index.html dist-domain/404.html
          cp dist-domain/index.html dist-domain/about/index.html
          cp dist-domain/index.html dist-domain/works/index.html
          mkdir -p dist-domain/works/ecolos dist-domain/works/oyster dist-domain/works/rennu
          cp dist-domain/index.html dist-domain/works/ecolos/index.html
          cp dist-domain/index.html dist-domain/works/oyster/index.html
          cp dist-domain/index.html dist-domain/works/rennu/index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist-domain/
          server-dir: ./www/bogdanovyan.ru/
